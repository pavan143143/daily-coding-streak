name: Daily Coding Challenge

on:
  schedule:
    - cron: "15 21 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-challenge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install holidays

      - name: Create today's challenge
        run: python scripts/create_daily_challenge.py

      - name: Commit and push challenge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "pavanpuli333@yahoo.com"

          git add daily-challenges/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: publish daily coding challenge"
          git push
